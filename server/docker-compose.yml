# docker-compose.yml — PRODUCTION
# Use this on your AWS EC2 instance.
# PostgreSQL is NOT here — use a managed DB (e.g. Neon, RDS).
# Set DB_URL and all other secrets in a .env file on the server.

services:
  api:
    build: .
    ports:
      - "8001:8000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_worker:
    build: .
    command: celery -A celery_service.celery_tasks.app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
