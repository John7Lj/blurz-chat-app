# docker-compose.yml — PRODUCTION (Minimal)
# Use this to run your containers locally/externally in production style.
# PostgreSQL and Redis are NOT here — they are managed externally.
# Set DB_URL, Redis_Url, and other secrets in your .env file.

services:
  api:
    build: .
    ports:
      - "8001:8000"
    env_file:
      - .env
    restart: unless-stopped

  celery_worker:
    build: .
    command: celery -A celery_service.celery_tasks.app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    restart: unless-stopped

